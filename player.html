<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المشغل - يلا كورة</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}
nav{position:sticky;top:0;z-index:10;background:#101820;padding:9px 6px;display:flex;gap:6px;justify-content:space-around;flex-wrap:wrap}
nav a{color:#fff;text-decoration:none;background:#263746;border-radius:7px;padding:8px 10px;font-size:13px}
main{padding:12px}.note{font-size:14px;line-height:1.7;color:#ddd}#player{width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;margin:12px 0}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #555;background:#222;color:#fff;direction:ltr}
button{padding:12px;border:0;border-radius:8px;background:#1e6b47;color:#fff;margin-top:8px;width:100%;font-size:15px}
</style>
<script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/clappr-level-selector-plugin@latest/dist/level-selector.min.js"></script>
</head>
<body>
<nav><a href="../home.html">الرئيسية</a><a href="manual-matches.html">المباريات اليدوية</a><a href="auto-matches.html">المباريات التلقائية</a><a href="channels.html">القنوات</a></nav>
<main>
<h3>مشغل يلا كورة</h3>
<p class="note">أدخل رابط بث M3U8 تملكه أو لديك إذن باستخدامه. بعض المصادر تمنع التشغيل داخل التطبيقات أو تتطلب إعدادات CORS/HTTPS مناسبة.</p>
<div id="player"></div>
<label for="streamUrl">رابط البث (M3U8)</label>
<input id="streamUrl" type="url" value="https://svs.itworkscdn.net/smc4sportslive/smc4.smil/playlist.m3u8" placeholder="https://example.com/live.m3u8">
<button onclick="playStream()">تشغيل البث</button>
<p id="status" class="note" role="status">اضغط تشغيل البث بعد التأكد من أن المصدر مسموح لك باستخدامه.</p>
</main>
<script>
let clapprPlayer;
function playStream(){
  const src=document.getElementById('streamUrl').value.trim();
  if(!/^https?:\\/\\//i.test(src)){document.getElementById('status').textContent='أدخل رابط HTTP أو HTTPS صحيحاً.';return;}
  if(clapprPlayer){try{clapprPlayer.destroy()}catch(e){}}
  document.getElementById('player').innerHTML='';
  if(!window.Clappr){document.getElementById('status').textContent='تعذر تحميل مكتبة المشغل. تحقق من الإنترنت.';return;}
  clapprPlayer=new Clappr.Player({source:src,parentId:'#player',width:'100%',height:'100%',autoPlay:false,mimeType:'application/x-mpegURL'});
  document.getElementById('status').textContent='إذا بقيت الشاشة سوداء فقد يكون المصدر يمنع التشغيل داخل WebView أو يحتاج إعدادات خاصة.';
}
</script>
</body></html>
